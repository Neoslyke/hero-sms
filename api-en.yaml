                $ref: "#/components/schemas/MaxPrice"
              fixedPrice:
                $ref: "#/components/schemas/FixedPrice"
              duration:
                $ref: "#/components/schemas/RentDuration"
              verificationType:
                $ref: "#/components/schemas/VerificationType"
              resellerUserId:
                $ref: "#/components/schemas/ResellerUserId"
            type: object
    ReactivateActivationRequestBody:
      content:
        application/json:
          schema:
            schema: ReactivateActivationRequestBody
            required: []
            properties:
              duration:
                $ref: "#/components/schemas/RentDuration"
            type: object
    ProlongActivationRequestBody:
      content:
        application/json:
          schema:
            schema: ProlongActivationRequestBody
            required:
              - duration
            properties:
              duration:
                $ref: "#/components/schemas/RentDuration"
            type: object
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      description: "Format: ApiKey {your_token}"
      name: Authorization
      in: header
    apiKeyQuery:
      type: apiKey
      name: api_key
      in: query
tags:
  - name: Activations
    description: List of active activations, purchase, and current offers
  - name: Activation OTP
    description: Receiving OTP for an active activation
  - name: Emails
    description: HeroSMS email activations
  - name: SMS-Activate
    description: API compatible with SMS-Activate
  - name: Classifiers
    description: Classifiers
  - name: Statistics
    description: Statistics
  - name: Webhooks
    description: >
      
      ##### Real-time event notification mechanism.

      After a purchase of the number, there is no need to repeatedly request
      activation status to receive incoming SMS messages.

      The service sends SMS content to the specified HTTPS URLs using the POST
      method.


      Up to 3 webhook URLs can be supported simultaneously.

      URLs are specified in the accounts personal information.

      Each webhook call is performed independently for each specified URL.

      - Method: POST

      - Content-Type: application/json

      - Response timeout: 3 seconds

      - If there is no response with code 200, the call is considered
      unsuccessful:
          - Number of retries - 7 times at least
          - Delay between retries - 20–30 seconds
          - Total duration of attempts - 3 minutes at least

      It is strongly recommended to respond with a 200 code even if the SMS has
      already been processed on the recipient's side.


      ##### Source IP addresses of webhook requests

      To ensure correct performance, add the following IP addresses to the
      whitelist:

      - ```84.32.223.53```

      - ```185.138.88.87```
webhooks:
  sms-incoming:
    post:
      tags:
        - Webhooks
      summary: "Webhook: incoming SMS"
      description: The event is sent upon reception of an incoming SMS to the number
        linked to the active activation
      operationId: smsIncoming
      requestBody:
        description: JSON with a data about the received SMS
        required: true
        content:
          application/json:
            schema:
              required:
                - activationId
                - id
                - phoneFrom
                - service
                - text
                - country
                - receivedAt
              properties:
                activationId:
                  $ref: "#/components/schemas/ActivationId"
                phoneFrom:
                  description: OTP source
                  type: string
                  example: "89854"
                service:
                  $ref: "#/components/schemas/ServiceId"
                text:
                  $ref: "#/components/schemas/SMSText"
                code:
                  $ref: "#/components/schemas/SMSCode"
                country:
                  $ref: "#/components/schemas/CountryId"
                receivedAt:
                  $ref: "#/components/schemas/dateISO8601"
                  description: SMS arrival time
              type: object
      responses:
        "200":
          description: Webhook successfully received (recommended response)
        default:
          description: Webhook is not accepted, up to 7 retries
