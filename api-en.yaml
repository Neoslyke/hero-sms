openapi: 3.2.0
info:
  title: API protocol for working with HEROSMS
  description: >-
    Do you use software for registrations? HeroSMS is compatible with former
    SMS-Activate partners


    1. Choose any software that includes SMS-Activate among its SMS reception
    services.

    2. Select SMS-Activate as the service for receiving SMS.

    3. Replace the host from https://api.sms-activate.ae to https://hero-sms.com
    in your software settings.

    4. Enter the API key from your HeroSMS account (request it on our website).


    If you face any difficulties, contact our tech support, please. We will deal
    with everything.
  version: "1.0"
servers:
  - url: https://hero-sms.com/api/v1
    description: HeroSMS API server
  - url: https://hero-sms.com/stubs/handler_api.php
    description: SMS-Activate API-compatible server
paths:
  /activations/history:
    get:
      tags:
        - Activations
      summary: Activation history
      operationId: 82eacb597b010298c78dacd1f0bdd3ff
      parameters:
        - $ref: "#/components/parameters/fromRequired"
        - $ref: "#/components/parameters/toRequired"
        - $ref: "#/components/parameters/servicesQuery"
        - $ref: "#/components/parameters/countriesQuery"
        - $ref: "#/components/parameters/activationStatusesQuery"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/search"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        id:
                          type: integer
                        createDate:
                          description: Date of creation
                          type: string
                          example: 2025-03-18 10:40:37
                        service:
                          $ref: "#/components/schemas/ServiceId"
                        country:
                          $ref: "#/components/schemas/CountryId"
                        phone:
                          $ref: "#/components/schemas/ActivationPhone"
                        moreCodes:
                          description: Received activation codes
                          type: string
                          example: 637881 is your verification code
                        cost:
                          $ref: "#/components/schemas/Price"
                        status:
                          $ref: "#/components/schemas/ActivationStatusTypes"
                        phoneCode:
                          type: string
                          example: "+55"
                        currency:
                          $ref: "#/components/schemas/Currency"
                      type: object
                  totals:
                    properties:
                      sum:
                        description: Amount
                        type: number
                        format: float
                        example: 0.6
                      successCount:
                        description: Number of successful activations
                        type: integer
                        example: 1
                    type: object
                  meta:
                    $ref: "#/components/schemas/PaginationMetaData"
                type: object
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
      x-sort-columns:
        - id
        - cost
        - createDate
  /activations/{activationId}/otp/last:
    get:
      tags:
        - Activation OTP
      summary: Get last OTP for the active activation
      operationId: getActivationOtpLast
      parameters:
        - $ref: "#/components/parameters/activationPath"
      responses:
        "200":
          $ref: "#/components/responses/ActivationOtpSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/{activationId}/otp:
    get:
      tags:
        - Activation OTP
      summary: Get OTP list for the active activation
      operationId: getActivationOtpList
      parameters:
        - $ref: "#/components/parameters/activationPath"
      responses:
        "200":
          $ref: "#/components/responses/ActivationOtpListSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations:
    get:
      tags:
        - Activations
      summary: Get a list of active activations
      description: Returns a list of active activations. Each activation includes the
        full OTP list.
      operationId: getActiveActivations
      parameters:
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/verificationTypeQuery"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
      responses:
        "200":
          $ref: "#/components/responses/ActivationsSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
      x-sort-columns:
        - id
    post:
      tags:
        - Activations
      summary: Purchase activation
      operationId: buyActivationBatch
      requestBody:
        $ref: "#/components/requestBodies/BuyActivationRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/ActivationsSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ActivationBannedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/{activationId}:
    delete:
      tags:
        - Activations
      summary: Cancel activation
      description: Cancellation of activation and refund. Cancellation is only
        possible if the activation has not received any OTP, or for an
        activation with a lifetime of 24 hours or more, less than 20 minutes
        have passed. Otherwise, call `POST /activations/{activationId}/finish`.
      operationId: cancelActivation
      parameters:
        - $ref: "#/components/parameters/activationPath"
      responses:
        "204":
          $ref: "#/components/responses/NoContentResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/{activationId}/finish:
    post:
      tags:
        - Activations
      summary: Complete activation
      description: Successful completion of activation. Funds are not refunded.
      operationId: finishActivation
      parameters:
        - $ref: "#/components/parameters/activationPath"
      responses:
        "204":
          $ref: "#/components/responses/NoContentResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/{activationId}/replace:
    post:
      tags:
        - Activations
      summary: Request number change
      operationId: replaceActivation
      parameters:
        - $ref: "#/components/parameters/activationPath"
      responses:
        "200":
          $ref: "#/components/responses/ActivationsSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ActivationBannedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/{activationId}/reactivate:
    post:
      tags:
        - Activations
      summary: Resume work with the number
      description: Resuming work with the number is only possible if the activation
        was completed successfully.
      operationId: reactivateActivation
      parameters:
        - $ref: "#/components/parameters/activationPath"
      requestBody:
        $ref: "#/components/requestBodies/ReactivateActivationRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/ActivationsSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/{activationId}/reactivate/options:
    get:
      tags:
        - Activations
      summary: Get available options for resuming work with the number
      operationId: reactivateOptions
      parameters:
        - $ref: "#/components/parameters/activationPath"
      responses:
        "200":
          $ref: "#/components/responses/ActivationExtendOptionsSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/{activationId}/prolong:
    post:
      tags:
        - Activations
      summary: Number rental extension
      operationId: prolongActivation
      parameters:
        - $ref: "#/components/parameters/activationPath"
      requestBody:
        $ref: "#/components/requestBodies/ProlongActivationRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/ActivationsSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "425":
          $ref: "#/components/responses/TooEarlyRequestResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/{activationId}/prolong/options:
    get:
      tags:
        - Activations
      summary: Get available number extension options
      operationId: prolongOptions
      parameters:
        - $ref: "#/components/parameters/activationPath"
      responses:
        "200":
          $ref: "#/components/responses/ActivationExtendOptionsSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "425":
          $ref: "#/components/responses/TooEarlyRequestResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/{activationId}/prolong/history:
    get:
      tags:
        - Activations
      summary: Get number extension history
      operationId: prolongActivationHistory
      parameters:
        - $ref: "#/components/parameters/activationPath"
      responses:
        "200":
          $ref: "#/components/responses/ProlongHistorySuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /classifiers/activations/custom-durations:
    get:
      tags:
        - Classifiers
      summary: Directory of positions with non-standard activation lifetimes
      operationId: customDurations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    description: service
                    type: object
                    additionalProperties:
                      description: country
                      type: object
                      additionalProperties:
                        description: minutes
                        type: integer
                        example: 60
                type: object
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
  /activations/stats:
    get:
      tags:
        - Activations
      summary: Current user statistics
      description: Returns activation statistics for the currently authorized user
      operationId: getActivationStats
      parameters:
        - name: date
          in: query
          description: Date for which statistics are required
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      country:
                        properties:
                          service:
                            properties:
                              count:
                                type: integer
                                example: 10
                              success:
                                type: integer
                                example: 5
                              percent:
                                $ref: "#/components/schemas/Percent"
                            type: object
                        type: object
                    type: object
                type: object
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /activations/offers/{verificationType}:
    get:
      tags:
        - Activations
      summary: Receive activation offers
      description: Returns activation offers grouped by service and country, and
        metadata to display them
      operationId: getActivationOffers
      parameters:
        - $ref: "#/components/parameters/verificationTypePath"
        - $ref: "#/components/parameters/servicesPath"
        - $ref: "#/components/parameters/countriesPath"
      responses:
        "200":
          $ref: "#/components/responses/ActivationsOffersSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/OfferNotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /emails:
    get:
      tags:
        - Emails
      summary: Get the list of active purchases
      operationId: 7f17119e77aad0c154d2f5e600ef092a
      parameters:
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/emailStatusesQuery"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailActivation"
                type: object
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
      x-sort-columns:
        - id
        - status
        - cost
        - date
    post:
      tags:
        - Emails
      summary: Purchase an activation by mail
      operationId: 22164e5067a27560b8fbf28b2ac1f019
      requestBody:
        content:
          application/json:
            schema:
              required:
                - site
                - domain
              properties:
                site:
                  $ref: "#/components/schemas/EmailSite"
                domain:
                  $ref: "#/components/schemas/EmailDomain"
                maxPrice:
                  $ref: "#/components/schemas/EmailMaxPrice"
              type: object
      responses:
        "201":
          $ref: "#/components/responses/EmailActivationSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /emails/batch:
    post:
      tags:
        - Emails
      summary: Buy activation by mail in bulk
      operationId: 7892a59d83e6e38d154854fe1f1b065f
      requestBody:
        content:
          application/json:
            schema:
              required:
                - site
                - domain
                - count
              properties:
                site:
                  $ref: "#/components/schemas/EmailSite"
                domain:
                  $ref: "#/components/schemas/EmailDomain"
                count:
                  description: Number of emails for activation (from 1 to 10)
                  type: integer
                  example: 5
                  maximum: 10
                  minimum: 1
                maxPrice:
                  $ref: "#/components/schemas/EmailMaxPrice"
              type: object
      responses:
        "201":
          $ref: "#/components/responses/EmailActivationBatchSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /emails/{emailId}:
    get:
      tags:
        - Emails
      summary: Check status of the activation by mail
      operationId: c57ebd15edbfa8625b8a60984b76e3c6
      parameters:
        - $ref: "#/components/parameters/emailId"
      responses:
        "200":
          $ref: "#/components/responses/EmailActivationSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/RaceConditionResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
    delete:
      tags:
        - Emails
      summary: Cancel the purchase of an activation by mail
      operationId: 20dae8daa691db1282f0d1d268dbac44
      parameters:
        - $ref: "#/components/parameters/emailId"
      responses:
        "204":
          description: OK
        "400":
          $ref: "#/components/responses/EmailCancelBadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/EmailCancelConflictResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /emails/{emailId}/reorder:
    post:
      tags:
        - Emails
      summary: Reorder an activation by mail
      operationId: bb0d53e0557982f130c1540ed663e831
      parameters:
        - $ref: "#/components/parameters/emailId"
      responses:
        "200":
          $ref: "#/components/responses/EmailActivationSuccessResponse"
        "400":
          $ref: "#/components/responses/EmailReorderBadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /emails/domains:
    get:
      tags:
        - Emails
      summary: Get the list of available domains
      description: The method is outdated. Use the GET emails/offers method
      operationId: 59f271906bdbc81b6b2cdd4213b01775
      parameters:
        - name: site
          in: query
          description: Website which an activation is purchased for
          required: true
          schema:
            type: string
            example: telegram.com
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        name:
                          description: Domain name
                          type: string
                        cost:
                          $ref: "#/components/schemas/Price"
                        count:
                          description: Number of available mails
                          type: integer
                      type: object
                type: object
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      deprecated: true
      security:
        - apiKeyAuth: []
  /emails/offers:
    get:
      tags:
        - Emails
      summary: Offers by domain
      description: "Returns price positions by site domains: within a domain by price,
        domains by minimum price"
      operationId: f8e545c04e941382450fcc88b14c4e89
      parameters:
        - name: site
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/EmailSite"
        - name: domain
          in: query
          description: Filter by domain
          required: false
          schema:
            $ref: "#/components/schemas/EmailDomain"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailOfferDomain"
                type: object
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  /stats/deliverability:
    get:
      tags:
        - Statistics
      summary: Get delivery statistics by country
      description: Returns the top countries by deliverability for selected services
      operationId: 60679e939ef779f9063f3a035599e820
      parameters:
        - $ref: "#/components/parameters/servicesQueryRequired"
        - $ref: "#/components/parameters/countriesQuery"
        - $ref: "#/components/parameters/intervalQuery"
        - $ref: "#/components/parameters/successCountQuery"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/withOperatorsQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: "Statistics by country for each service: key - service code, value
                      - countries in descending order of deliverability"
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        required:
                          - country
                          - successRate
                        properties:
                          country:
                            $ref: "#/components/schemas/CountryId"
                          successRate:
                            $ref: "#/components/schemas/SuccessRate"
                          operators:
                            description: Present only if parameter withOperators=true
                            type:
                              - array
                              - "null"
                            items:
                              properties:
                                code:
                                  $ref: "#/components/schemas/OperatorCode"
                                successRate:
                                  $ref: "#/components/schemas/SuccessRate"
                                share:
                                  description: Operator’s share of the total number of successful purchases in the
                                    country, from 1% (the sum of shares may be
                                    less than 100%)
                                  type: number
                                  format: float
                                  minimum: 1
                              type: object
                        type: object
                  meta:
                    properties:
                      filters:
                        properties:
                          services:
                            type: array
                            items:
                              type: string
                          countries:
                            type: array
                            items:
                              type: integer
                          interval:
                            type: integer
                          successCount:
                            type: string
                            enum:
                              - very_high
                              - high
                              - medium
                              - low
                          withOperators:
                            type: boolean
                        type: object
                      updatedAt:
                        type: string
                        format: date-time
                    type: object
                type: object
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "500":
          $ref: "#/components/responses/ServerErrorResponse"
      security:
        - apiKeyAuth: []
  ?action=getBalance:
    get:
      tags:
        - SMS-Activate
      summary: Request account balance
      description: Returns the current balance in the format `ACCESS_BALANCE:<amount>`
      operationId: getBalance
      responses:
        "200":
          description: Balance request result
          content:
            application/json:
              schema:
                type: string
              examples:
                successfulBalanceExample:
                  $ref: "#/components/examples/successfulBalanceExample"
        "401":
          $ref: "#/components/responses/unauthorizedResponse"
        "404":
          $ref: "#/components/responses/methodNotFoundResponse"
        "422":
