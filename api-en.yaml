components:
  schemas:
    ActivationExtendDurationDTO:
      required:
        - unit
        - value
      properties:
        unit:
          type: string
          example: hour
          enum:
            - minute
            - hour
        value:
          type: integer
          example: 24
      type: object
    ActivationExtendOptionDTOSchema:
      required:
        - price
        - duration
      properties:
        price:
          $ref: "#/components/schemas/Price"
        duration:
          $ref: "#/components/schemas/ActivationExtendDurationDTO"
      type: object
    ProlongationHistoryItemSchema:
      properties:
        duration:
          type: integer
          example: 24
        price:
          $ref: "#/components/schemas/Price"
        createdAt:
          $ref: "#/components/schemas/dateISO8601"
      type: object
    ActivationStatusTypes:
      description: Activation status
      type: integer
      example: 4
      enum:
        - 1
        - 2
        - 3
        - 4
        - 6
        - 7
        - 8
        - 10
    EmailActivationStatus:
      description: Email activation status
      type: integer
      example: 3
      enum:
        - 3
        - 4
        - 5
        - 6
        - 7
      x-enum-descriptions:
        "3": Waiting for a message
        "4": Cancelled, no message received
        "5": Message received, active (not completed)
        "6": Completed by the user or by timeout, message received
        "7": Refunded
    EmailActivation:
      description: Activation by mail
      required:
        - id
        - status
        - cost
        - currency
        - date
      properties:
        id:
          description: ID
          type: integer
        site:
          $ref: "#/components/schemas/EmailSite"
        email:
          description: Mail
          type: string
        status:
          $ref: "#/components/schemas/EmailActivationStatusView"
        value:
          description: Code
          type:
            - string
            - "null"
        cost:
          $ref: "#/components/schemas/Price"
        currency:
          $ref: "#/components/schemas/Currency"
        date:
          $ref: "#/components/schemas/dateISO8601"
          description: Date of creation
        message:
          description: Full text of the email
          type:
            - string
            - "null"
      type: object
    ActivationOtpSchema:
      properties:
        id:
          type: string
          example: "12345643242"
        smsCode:
          type:
            - string
            - "null"
          example: "123456"
        smsText:
          type:
            - string
            - "null"
          example: Your verification code is 123456
        receivedAt:
          $ref: "#/components/schemas/dateISO8601"
        type:
          $ref: "#/components/schemas/VerificationType"
        phoneFrom:
          type: string
          example: "89854"
        service:
          $ref: "#/components/schemas/ServiceId"
      type: object
    ActivationSchema:
      properties:
        id:
          $ref: "#/components/schemas/ActivationId"
        status:
          $ref: "#/components/schemas/ActivationStatusTypes"
        phone:
          $ref: "#/components/schemas/ActivationPhone"
        service:
          $ref: "#/components/schemas/ServiceId"
        country:
          $ref: "#/components/schemas/CountryId"
        countryPhoneCode:
          type: integer
          example: 7
        operator:
          $ref: "#/components/schemas/OperatorId"
        price:
          $ref: "#/components/schemas/Price"
        createdAt:
          $ref: "#/components/schemas/dateISO8601"
        expiredAt:
          $ref: "#/components/schemas/dateISO8601"
        verificationType:
          $ref: "#/components/schemas/VerificationType"
        subtype:
          $ref: "#/components/schemas/ActivationSubtype"
        otpList:
          type: array
          items:
            $ref: "#/components/schemas/ActivationOtpSchema"
          minItems: 0
      type: object
    SuccessRate:
      description: Percentage of successful purchases based on the number of attempts
      type: number
      format: float
      example: 20
    OperatorCode:
      description: Operator code
      type: string
      example: any
    ActivationsOffersSchema:
      additionalProperties:
        title: Service
        type: object
        additionalProperties:
          title: Country ID
          properties:
            prices:
              properties:
                default:
                  type: number
                  format: float
                  example: 1.1
                retail:
                  type: number
                  format: float
                  example: 1.1
                min:
                  $ref: "#/components/schemas/MinPrice"
              type: object
            counts:
              properties:
                total:
                  type: integer
                  example: 101
                physical:
                  type: integer
                  example: 51
                defaultPrice:
                  type: integer
                  example: 50
              type: object
            map:
              type: object
              additionalProperties:
                title: Price
                description: Price -> quantity
                type: integer
          type: object
    ActivationsOffersMetaData:
      allOf:
        - $ref: "#/components/schemas/PaginationMetaData"
        - properties:
            order:
              description: Display order of data for each sort type
              properties:
                rate:
                  description: Order of services and countries by rating
                  type: object
                deliverability:
                  properties:
                    countries:
                      type: array
                      items:
                        type: integer
                  type: object
              type: object
            filters:
              description: Filters applied to the sample
              properties:
                countries:
                  type:
                    - array
                    - "null"
                  items:
                    $ref: "#/components/schemas/CountryId"
                services:
                  type:
                    - array
                    - "null"
                  items:
                    type: string
              type: object
          type: object
    EmailSite:
      description: Website which an activation is purchased for
      type: string
      example: telegram.com
    EmailDomain:
      description: Mail domain
      type: string
      example: gmail.com
    EmailMaxPrice:
      description: The upper limit of the position price in the balance currency.
        Without a parameter, the cheapest position is taken
      type:
        - number
        - "null"
      format: float
      example: 0.5
      minimum: 0
    EmailOffer:
      description: Price position by domain
      required:
        - cost
        - count
      properties:
        cost:
          description: Price of one mail
          type: number
          format: float
          example: 0.075
        count:
          description: Available at this price
          type: integer
          example: 10
      type: object
    EmailOfferDomain:
      description: Domain and its price positions, sorted by price
      required:
        - domain
        - offers
      properties:
        domain:
          $ref: "#/components/schemas/EmailDomain"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/EmailOffer"
      type: object
    EmailActivationStatusView:
      description: Email activation status
      type: string
      example: WAIT
      enum:
        - WAIT
        - CANCEL
        - SUCCESS
      x-enum-descriptions:
        WAIT: Waiting for a message
        CANCEL: Cancelled or refunded
        SUCCESS: Message received (active or completed)
    PaginationMetaData:
      description: Pagination metadata
      required:
        - page
        - size
        - sort
        - total
      properties:
        page:
          description: Number of the page containing data
          type:
            - integer
            - "null"
          example: 1
        size:
          description: Size of the page containing data
          type:
            - integer
            - "null"
          example: 10
        sort:
          description: Sorting data by several fields
          type: object
          additionalProperties:
            description: Sort direction
            type: string
            enum:
              - asc
              - desc
        total:
          description: Total number of records
          type:
            - integer
            - "null"
          example: 100
        hasMore:
          description: Is there a next page
          type: boolean
          example: true
        search:
          description: Search bar
          type: string
          example: "8800"
        filters:
          description: Available filter values for the selection
          type: object
          example:
            countries:
              - ru
              - ua
            services:
              - go
              - tg
      type: object
    ActivationPhone:
      description: Phone number without + sign
      type: integer
      example: 79991234567
    CountryId:
      description: Country ID
      type: integer
      example: 2
      maximum: 999
      minimum: 0
    ServiceId:
      description: Service code
      type: string
      pattern: ^[a-zA-Z]{2,4}$
      example: tg
      maxLength: 4
      minLength: 2
    OperatorId:
      description: Operator code or several codes separated by commas. If omitted, any
        operator
      type: string
      pattern: ^([a-zA-Z0-9!_]{2,},)*[_a-zA-Z0-9!]{2,}$
      example: axis
      default: any
    PhoneException:
      description: "Phone number prefixes to exclude, separated by commas: up to 20
        prefixes of 4–7 digits each"
      type:
        - string
        - "null"
      pattern: ^[0-9]{4,7}(,[0-9]{4,7}){0,19}$
      example: 7900,7901234
    MaxPrice:
      description: Maximum activation cost
      type: number
      format: float
      example: 0.4321
      minimum: 0.0067
    Price:
      description: Price
      type: number
      format: float
      example: 0.4321
    Percent:
      description: Percent
      type: number
      format: float
      example: 50
    FixedPrice:
      description: Purchasing strictly at the specified maxPrice. Use with the
        maxPrice parameter.
      type: boolean
      example: true
    RentDuration:
      description: Rental duration in hours
      type: integer
      example: 24
      enum:
        - 24
        - 72
        - 168
        - 336
        - 720
        - 1440
        - 2160
        - 4320
    ActivationHistoryStatus:
      description: Completed activation status
      type: integer
      example: 6
      enum:
        - 6
        - 8
        - 10
      x-enum-descriptions:
        "6": Completed successfully
        "8": Cancelled
        "10": Refund
    ResellerUserId:
      description: End customer identifier in the reseller's system
      type: string
      pattern: ^[a-zA-Z0-9_.@-]{1,36}$
      example: "12345"
      maxLength: 36
      minLength: 1
    MinPrice:
      description: the lowest possible personal price
      type: number
      format: float
      example: 0.4321
    ActivationId:
      description: Activation ID
      type: integer
      example: 123456
    Currency:
      description: ISO currency code
      type: integer
      example: 840
      default: 840
      enum:
        - 840
        - 978
        - 156
    SMSText:
      description: SMS Text
      type:
        - string
        - "null"
